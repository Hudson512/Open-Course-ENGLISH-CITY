# Every place the player can enter: the building, who works there, what it sells and useful vocabulary.
# To add a place, copy one block, change the id (first line) and move the building to a free spot.

airport:
  name: "Maple City International Airport"
  short: "Airport"
  icon: ✈️
  building: { at: [1, 21], size: [13, 23], door: right, color: "#8fa3b8", roof: "#5d7085" }
  character:
    id: taxi_driver
    name: "Tony"
    emoji: 🚕
    voice: { gender: male, rate: 1 }
    role: "Taxi driver at the airport taxi rank"
    persona: >
      Tony Russo, 52, born in Queens, has driven a cab for 25 years. Friendly but a tough
      negotiator, talks fast, uses expressions like "buddy", "no way", "tell you what".
      Loves baseball and complains about traffic.

phone_store:
  name: "PhoneHub"
  short: "Phone store"
  icon: 📱
  building: { at: [22, 3], size: [10, 10], door: bottom, color: "#6c5ce7", roof: "#4834d4" }
  character:
    id: phone_clerk
    name: "Raj"
    emoji: 📱
    voice: { gender: male, rate: 1.05 }
    role: "Sales clerk at PhoneHub"
    persona: >
      Raj Patel, 30, enthusiastic tech salesman. Explains prepaid vs monthly plans, data
      (GB), unlimited calls and texts. Needs to know if the customer has an unlocked phone.
      Tries to upsell a phone case.
  sells:
    prepaid SIM card:   { price: 15.00, effects: [{ set_flag: phone }] }
    monthly phone plan: { price: 40.00, effects: [{ set_flag: phone }] }
    phone charger:      { price: 19.99 }
    phone case:         { price: 14.99 }
  vocabulary: ["prepaid", "data plan", "unlimited", "unlocked phone", "SIM card", "coverage", "contract", "per month"]

hotel:
  name: "Hotel Sunrise"
  short: "Hotel"
  icon: 🏨
  building: { at: [22, 22], size: [11, 10], door: top, color: "#e17055", roof: "#b44a32" }
  character:
    id: hotel_clerk
    name: "Emily"
    emoji: 🛎️
    voice: { gender: female, rate: 1 }
    role: "Front desk clerk at Hotel Sunrise"
    persona: >
      Emily Carter, 27, very polite and professional, uses customer-service phrases ("How
      may I help you?", "Certainly"). Needs a name, number of nights and payment to check a
      guest in.
  lodging: { per: night, price: 110, min: 85, max: 140, max_nights: 14 }

apartment:
  name: "Oak Street Apartments"
  short: "Apartments"
  icon: 🏢
  building: { at: [36, 22], size: [12, 10], door: top, color: "#b08968", roof: "#7f5539" }
  character:
    id: landlord
    name: "Mr. Johnson"
    emoji: 🔑
    voice: { gender: male, rate: 0.95 }
    role: "Landlord of Oak Street Apartments"
    persona: >
      Robert Johnson, 64, retired mechanic, owns a small apartment building. Calm, a bit
      old-fashioned, cares about quiet tenants. Will ask about job, how long they stay, and
      explain house rules (no loud music after 10 pm, trash on Tuesdays).
  lodging: { per: week, price: 180, min: 150, max: 230 }

bakery:
  name: "Sweet Crumbs Bakery"
  short: "Bakery"
  icon: 🥐
  building: { at: [22, 35], size: [9, 8], door: bottom, color: "#fdcb6e", roof: "#e1a32b" }
  character:
    id: baker
    name: "Rosa"
    emoji: 👩‍🍳
    voice: { gender: female, rate: 1 }
    role: "Owner of Sweet Crumbs Bakery"
    persona: >
      Rosa Martinez, 45, warm and chatty Mexican-American baker. Proud of her sourdough,
      recommends items, asks "for here or to go?".
  sells:
    bagel:                 { price: 2.50, food: 15 }
    croissant:             { price: 3.50, food: 18 }
    loaf of bread:         { price: 4.50, food: 35 }
    sourdough bread:       { price: 6.50, food: 40 }
    blueberry muffin:      { price: 3.25, food: 18 }
    donut:                 { price: 2.00, food: 12 }
    chocolate chip cookie: { price: 1.75, food: 8 }
    cinnamon roll:         { price: 3.75, food: 20 }
    coffee:                { price: 2.25, food: 2, energy: 10, consume: now }
  vocabulary: ["for here or to go", "a loaf of", "freshly baked", "a dozen", "I'd like…", "How much is…?", "receipt", "change"]

barber:
  name: "Sharp Cuts Barbershop"
  short: "Barbershop"
  icon: 💈
  building: { at: [34, 35], size: [8, 8], door: bottom, color: "#74b9ff", roof: "#0984e3" }
  character:
    id: barber
    name: "Marcus"
    emoji: 💈
    voice: { gender: male, rate: 1.05 }
    role: "Barber at Sharp Cuts"
    persona: >
      Marcus Williams, 34, relaxed and funny barber. Loves basketball and music. Asks
      precise questions about the haircut: "How short on the sides? Scissors or clippers?
      Want me to clean up the beard?"
  services:
    haircut:                { price: 25.00, effects: [{ stat: { social: 12 } }] }
    beard trim:             { price: 15.00, effects: [{ stat: { social: 12 } }] }
    haircut and beard trim: { price: 35.00, effects: [{ stat: { social: 12 } }] }
    shave:                  { price: 20.00, effects: [{ stat: { social: 12 } }] }
    buzz cut:               { price: 18.00, effects: [{ stat: { social: 12 } }] }
  vocabulary: ["trim", "fade", "clippers", "scissors", "a little off the top", "short on the sides", "beard", "part"]

