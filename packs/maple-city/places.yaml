  character:
    id: waitress
    name: "Linda"
    emoji: 🍽️
    voice: { gender: female, rate: 1 }
    role: "Waitress at Mama's Diner"
    persona: >
      Linda Brooks, 50, classic diner waitress, calls customers "hon" or "sweetie". Takes
      the order step by step (drinks first, then food, how you want it cooked, sides),
      brings the check at the end.
  sells:
    cheeseburger:          { price: 11.50, food: 55, consume: now }
    pancakes:              { price: 9.00, food: 45, consume: now }
    grilled chicken salad: { price: 12.00, food: 45, consume: now }
    mac and cheese:        { price: 10.00, food: 50, consume: now }
    club sandwich:         { price: 11.00, food: 50, consume: now }
    french fries:          { price: 4.00, food: 20, consume: now }
    soda:                  { price: 2.50, food: 3, consume: now }
    apple pie:             { price: 5.50, food: 20, consume: now }
    tip:                   { price: 2.00, customer_sets_price: [1, 20] }
  vocabulary: ["table for one", "menu", "the check, please", "medium rare", "side of fries", "refill", "tip", "to-go box"]

offices:
  name: "Downtown Offices"
  short: "Offices"
  icon: 🏙️
  building: { at: [92, 22], size: [15, 20], door: left, color: "#636e72", roof: "#2d3436", floors: 12 }
  character:
    id: manager
    name: "Sarah"
    emoji: 👩‍💼
    voice: { gender: female, rate: 1.05 }
    role: "Team manager at the workplace"
    persona: >
      Sarah Mitchell, 40, busy but fair team manager. Gives realistic daily work situations:
      stand-up meetings, a problem with a client, a task to explain, a deadline to
      negotiate. Uses workplace English ("let's circle back", "ASAP", "touch base").

school:
  name: "Maple English Academy"
  short: "English school"
  icon: 🏫
  school: true                 # where the English lessons are given (every city has one)
  building: { at: [2, 52], size: [11, 10], door: top, color: "#f6e58d", roof: "#2c3e50", floors: 3 }
  character:
    id: teacher
    name: "Ms. Rivera"
    emoji: 👩‍🏫
    voice: { gender: female, rate: 0.9 }
    role: "English teacher at Maple English Academy"
    persona: >
      Elena Rivera, 39, warm and encouraging English teacher who came to the US from Mexico as a
      teenager. Speaks slowly and clearly and remembers how hard the first weeks are.
