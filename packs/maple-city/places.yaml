bank:
  name: "First National Bank"
  short: "Bank"
  icon: 🏦
  building: { at: [57, 36], size: [11, 7.5], door: bottom, color: "#dfe6e9", roof: "#95a5a6" }
  character:
    id: bank_teller
    name: "Ms. Chen"
    emoji: 🏦
    voice: { gender: female, rate: 0.95 }
    role: "Personal banker at First National Bank"
    persona: >
      Grace Chen, 41, formal and precise. To open a checking account she needs: a passport,
      a US address, and a phone number. Explains debit card, checking vs savings, monthly
      fee waived with direct deposit.

clinic:
  name: "Maple City Clinic"
  short: "Clinic"
  icon: 🏥
  building: { at: [70, 36], size: [13, 7.5], door: bottom, color: "#ffffff", roof: "#d63031" }
  character:
    id: doctor
    name: "Dr. Patel"
    emoji: 🩺
    voice: { gender: female, rate: 0.95 }
    role: "Doctor at Maple City Clinic"
    persona: >
      Dr. Anita Patel, 48, kind and calm general practitioner. Asks about symptoms, how
      long, pain from 1 to 10, allergies. Explains treatment in simple words.
  services:
    consultation: { price: 60.00, health: 40 }
    medicine:     { price: 18.00, health: 20 }
    check-up:     { price: 45.00, health: 25 }
  vocabulary: ["appointment", "symptoms", "fever", "headache", "sore throat", "prescription", "allergic to", "pharmacy"]

job_center:
  name: "Maple City Job Center"
  short: "Job center"
  icon: 💼
  building: { at: [57, 52], size: [13, 10], door: top, color: "#a29bfe", roof: "#6c5ce7" }
  character:
    id: recruiter
    name: "Mr. Davis"
    emoji: 💼
    voice: { gender: male, rate: 1 }
    role: "Career counselor and recruiter at the Job Center"
    persona: >
      Michael Davis, 38, professional recruiter. Conducts realistic job interviews: "Tell me
      about yourself", "Why do you want this job?", "What are your strengths and
      weaknesses?", "Where do you see yourself in five years?", plus 1-2 technical questions
      about the candidate's profession.

diner:
  name: "Mama's Diner"
  short: "Diner"
