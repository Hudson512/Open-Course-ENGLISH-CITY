# Missions of Maple City.
#   at        where it happens (a place id). The player talks to the character who works there.
#   title     shown in the mission list, in each interface language
#   goal      what the player is told to do
#   brief     instructions for the AI playing the character (never shown to the player)
#   allow     actions the character may use (actions.yaml)
#   complete  when the mission counts as done
#   requires  what the player needs before the mission is available
# {{…}} inserts a value from the pack or from the player's situation.

# ── Story ─────────────────────────────────────────────────────────

arrival_taxi:
  kind: story
  lesson: a1-taxi            # the English lesson that prepares this mission (courses/english)
  at: airport
  title: { en: Get a taxi from the airport, pt: Apanhe um táxi no aeroporto }
  goal:
    en: >
      Talk to the taxi driver, choose {{place.hotel.name}} ({{money place.hotel.lodging.price}}/night)
      or {{place.apartment.name}} ({{money place.apartment.lodging.price}}/week), and negotiate the fare.
    pt: >
      Fala com o taxista, escolhe o {{place.hotel.name}} ({{money place.hotel.lodging.price}}/noite)
      ou o {{place.apartment.name}} ({{money place.apartment.lodging.price}}/semana) e negoceia o preço da corrida.
  brief: >
    The passenger just landed in {{city.name}} with luggage and needs a ride to either
    {{place.hotel.name}} (downtown, {{money place.hotel.lodging.price}}/night, easy check-in) or
    {{place.apartment.name}} ({{money place.apartment.lodging.price}}/week, cheaper for a long stay but
    the landlord asks questions). You first ask where they are going. Your opening price is
    {{money action.agree_price.start}}. Your secret minimum is {{money action.agree_price.min}}.
    Haggle realistically: lower the price in small steps only when the passenger negotiates politely
    in English (gives a counteroffer, a reason, mentions other taxis or the bus). Mention the
    luggage/trunk. When both the destination and price are agreed, emit set_destination and
    agree_price and say something like "Hop in!".
  allow: [agree_price, set_destination, end]
  vocabulary: [fare, "How much to…?", "That's too expensive", "Can you do…?", deal, luggage, trunk, downtown, receipt]
  complete: { all: [{ did: agree_price }, { did: set_destination }] }
  reward: { xp: 80, social: 5 }

lodging:
  kind: story
  lesson: a1-lodging
  at: "{{choice.lodging_place}}"       # hotel or apartment, decided in the taxi
  variants:                            # same mission, different text depending on the place
    hotel:
      title: { en: "Check in at {{place.name}}", pt: "Faz o check-in no {{place.name}}" }
      goal:
        en: "Check in: say your name, how many nights, and pay."
        pt: "Check-in: diz o teu nome, quantas noites vais ficar e paga."
      brief: >
        A new guest arrives at the front desk. Room rate is {{money place.lodging.price}} per night
        (you can offer $95 for 5+ nights). Ask for their name, number of nights, ID (passport is
        fine) and confirm payment by card. Mention check-out time (11 am) and free breakfast
        7-10 am. Then emit rent.
    apartment:
      title: { en: Rent a room at Oak Street, pt: Aluga um quarto no Oak Street }
      goal:
        en: "Convince the landlord to rent you a room: talk about yourself, your plans and the price."
        pt: "Convence o senhorio a alugar-te um quarto: fala de ti, dos teus planos e do preço."
      brief: >
        A newcomer wants to rent a furnished room. Rent is {{money place.lodging.price}} per week,
        paid weekly in advance. You can go down to {{money place.lodging.min}} if they make a good
        impression (explain why they came, their profession, that they are quiet and responsible).
        Ask questions before agreeing, explain the house rules, then emit rent.
  allow: [rent, end]
  vocabulary: [check in, check out, reservation, per night, deposit, lease, rent, utilities included, tenant, landlord]
  complete: { did: rent }
  reward: { xp: 70, social: 5 }

get_phone:
  kind: story
  lesson: a1-phone
  at: phone_store
  title: { en: Get a US phone number, pt: Arranja um número de telefone americano }
  goal:
    en: Buy a prepaid SIM card or a monthly plan at {{place.name}}.
    pt: Compra um cartão SIM pré-pago ou um plano mensal na {{place.name}}.
  brief: >
    The customer needs a US phone number. Ask if their phone is unlocked, explain prepaid SIM
    ($15, includes first 2 weeks) vs monthly plan ($40, unlimited calls/texts, 15 GB). Try to
    upsell a phone case once. {{price_list}}
  allow: [sell, end]
  complete: { flag: phone }            # set by buying the SIM card or the plan (places.yaml)
  reward: { xp: 60, social: 3 }

open_bank:
  kind: story
  at: bank
  title: { en: Open a bank account, pt: Abre uma conta bancária }
  goal:
    en: Open a checking account. You need an address and a US phone number.
    pt: Abre uma conta corrente. Precisas de morada e de um número de telefone americano.
  brief:                               # a list is joined into one text; `when` picks a sentence
    - "The customer wants to open a checking account. Requirements: passport (they have it),"
    - when: { has: home }
      text: "a US address (they live at {{home.name}}),"
      else: "a US address (they DO NOT have one yet),"
    - when: { flag: phone }
      text: "and a US phone number (they have one)."
      else: "and a US phone number (they DO NOT have one yet)."
    - >
      If a requirement is missing, politely explain what they need and do not open the account.
      Otherwise ask for details (full name, date of birth, occupation), explain the debit card and
      the $10 monthly fee (waived with direct deposit), then emit open_account.
  allow: [open_account, end]
  vocabulary: [checking account, savings account, debit card, PIN, deposit, withdraw, fee, direct deposit, ID]
  complete: { did: open_account }
  reward: { xp: 70, social: 3 }

job_interview:
  kind: story
  at: job_center
  title: { en: Job interview, pt: Entrevista de emprego }
  goal:
    en: Pass a job interview in your field. Requires level A2, an address, a phone and a bank account.
    pt: Passa numa entrevista de emprego na tua área. Requer nível A2, morada, telefone e conta bancária.
  requires:
    all: [{ level: A2 }, { has: home }, { flag: phone }, { flag: bank }, { not: { has: job } }]
  retry: next_day                      # after a rejection
  brief: >
    Interview the candidate for a "{{player.job_offer.title}}" position (field:
    {{player.profession.label}}). Ask ONE question per turn: tell me
    about yourself, experience, why this job, strengths/weaknesses, 1-2 practical questions about
    the field, availability. After 5-7 questions, decide. Judge communication in English AND
    content. Emit hire (score >= 60) or reject (score < 60) with honest feedback.
  allow: [hire, reject, end]
  vocabulary: [résumé, experience, strengths, weakness, teamwork, deadline, full-time, salary, "I'm a quick learner"]
  complete: { did: hire }
  reward: { xp: 150, social: 10 }

# ── Job ───────────────────────────────────────────────────────────

work_shift:
  kind: job
  at: "{{player.job.workplace}}"
  character: offices                   # Sarah, the manager, is who you talk to wherever you work
  once_per: day
  requires: { has: job }
  title: { en: Work shift, pt: Turno de trabalho }
  goal:
    en: Handle today's situation at work in English to get paid.
    pt: Resolve a situação de hoje no trabalho, em inglês, para receberes o salário.
  brief: >
    The employee works as "{{player.job.title}}" ({{player.profession.name}}). Today's situation:
    {{rotate situations}}. Play it out realistically in 4-6 turns (you may play the client or
    colleague when needed). Then emit work_done with performance.
  lists:
    situations:                        # one per day, in order, then it starts again
      - "a morning stand-up meeting: ask what they did yesterday and plan today"
      - an unhappy client/customer complaint the employee must handle politely
      - explaining a task step by step to a new colleague
      - negotiating a deadline that is too tight
      - writing (saying) a short professional email/message to a client
      - a problem that needs to be reported to the manager
  allow: [work_done, end]
  vocabulary: [ASAP, deadline, follow up, schedule, meeting, issue, update, Let me check, "I'll take care of it"]
  complete: { did: work_done }
  reward: { xp: 90, social: 8 }

# ── Daily (picked from the pool in city.yaml, which fills in `with`) ──

shop:
  kind: daily
  at: "{{with.place}}"
  title: { en: "Shopping: {{list with.items}}", pt: "Compras: {{list with.items}}" }
  goal:
    en: Buy {{list with.items}} at {{place.name}}.
    pt: Compra {{list with.items}} em {{place.name}}.
  brief: >
    The customer needs to buy: {{list with.items}} (but they must ask for it themselves — do not
    list it for them). Serve them naturally, ask the usual follow-up questions for this kind of
    place, tell the total, and take payment. {{price_list}}
  allow: [sell, service, end]          # the game keeps only what the place offers
  complete: { bought: with.items }
  reward: { xp: 50, social: 4 }

barber_cut:
  kind: daily
  at: barber
  title: { en: "Get a haircut: {{with.style}}", pt: "Corta o cabelo: {{with.style}}" }
  goal:
    en: 'Explain to the barber exactly what you want: "{{with.style}}". Pay and tip.'
    pt: 'Explica ao barbeiro exatamente o que queres: "{{with.style}}". Paga e deixa gorjeta.'
  brief: >
    The customer wants a haircut. They should describe it themselves (their target is
    "{{with.style}}", don't reveal it). Ask precise questions (clippers number, how short on the
    sides, the top, beard, neckline). Describe what you are doing with small talk. At the end emit
    service. {{price_list}}
  allow: [service, end]
  complete: { did: service }
  reward: { xp: 60, social: 15 }

chat_people:
  kind: daily
  at: park
  title: { en: "Talk to {{with.count}} people in the street", pt: "Fala com {{with.count}} pessoas na rua" }
  goal:
    en: Walk up to {{with.count}} pedestrians (E) and have a short chat.
    pt: Aproxima-te de {{with.count}} pessoas (tecla E) e conversa um pouco.
  complete: { count: smalltalk, at_least: with.count }   # counts finished `smalltalk` missions
  reward: { xp: 40, social: 10 }

online_chat:
  kind: daily
  title: { en: Talk to a real player, pt: Fala com um jogador real }
  goal:
    en: Send 3 messages in English to another online player near you (Enter to chat).
    pt: Envia 3 mensagens em inglês a outro jogador online perto de ti (Enter para conversar).
  complete: { count: online_messages, at_least: 3 }
  reward: { xp: 60, social: 20 }

# ── Always available ──────────────────────────────────────────────

smalltalk:                             # starts when the player stops a pedestrian (people.yaml)
  kind: social
  lesson: a1-first-words
  with_person: true
  title: { en: "Chat with {{person.name}}", pt: "Conversa com {{person.name}}" }
  goal:
    en: Have a friendly conversation (at least 4 messages).
    pt: Tem uma conversa amigável (pelo menos 4 mensagens).
  brief: >
    You are a stranger in the street/park. {{person.persona}} The player approaches you. Make
    friendly small talk: weather, the city, where they are from, recommendations. Ask questions
    back. Be a real person, with opinions.
  allow: [end]
  vocabulary: ["How's it going?", Nice to meet you, "Where are you from?", "What do you do?", "Have a good one!", by the way]
  complete: { turns: 4 }
  reward: { xp: 30, social: 12 }

visit:                                 # walking into a place with no mission there
  kind: free
  at: any
  title: { en: "Visit {{place.name}}", pt: "Visitar {{place.name}}" }
  goal:
    en: Talk and buy what you need at {{place.name}}.
    pt: Conversa e compra o que precisares em {{place.name}}.
  brief: >
    A customer walks in. Serve them naturally, ask the usual follow-up questions for this kind of
    place, tell the total, and take payment. {{price_list}}
  allow: [sell, service, end]
