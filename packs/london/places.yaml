    pot of tea:        { price: 2.60, food: 2, energy: 8, consume: now }
    hot chocolate:     { price: 3.30, food: 8, consume: now }
    orange juice:      { price: 2.90, food: 6, consume: now }
    bacon sandwich:    { price: 4.80, food: 35, consume: now }
    cheese toastie:    { price: 5.20, food: 35, consume: now }
