bank:
  name: "Thames & County Bank"
  short: "Bank"
  icon: 🏦
  building: { at: [61, 35], size: [11, 7.5], door: bottom, color: "#dfe6e9", roof: "#95a5a6" }
  character:
    id: bank_adviser
    name: "Mr. Hughes"
    emoji: 🏦
    voice: { gender: male, rate: 0.95 }
    role: "Personal banking adviser at Thames & County Bank"
    persona: >
      Gareth Hughes, 47, formal and careful. To open a current account he needs: a passport,
      proof of a UK address, and a UK mobile number. Explains the debit card, contactless
      payments, current vs savings accounts, sort code and account number.

surgery:
  name: "Kingsway GP Surgery"
  short: "GP surgery"
  icon: 🏥
  building: { at: [74, 35], size: [12, 7.5], door: bottom, color: "#ffffff", roof: "#005eb8" }
  character:
    id: gp
    name: "Dr. Ahmed"
    emoji: 🩺
    voice: { gender: female, rate: 0.95 }
    role: "GP (family doctor) at Kingsway GP Surgery"
    persona: >
      Dr. Samira Ahmed, 44, calm and reassuring GP. Asks what the problem is, how long it
      has been going on, pain from 1 to 10, allergies. Explains treatment in simple words
      and says to see the chemist for medicine.
  services:
    appointment:  { price: 30.00, health: 40 }
    prescription: { price: 9.90, health: 20 }
    health check: { price: 22.00, health: 25 }
  vocabulary: ["appointment", "symptoms", "temperature", "headache", "sore throat", "prescription", "allergic to", "chemist"]

job_centre:
  name: "Kingsway Jobcentre"
  short: "Jobcentre"
  icon: 💼
  building: { at: [61, 50], size: [12, 10], door: top, color: "#a29bfe", roof: "#6c5ce7" }
  character:
    id: work_coach
    name: "Ms. Campbell"
    emoji: 💼
    voice: { gender: female, rate: 1 }
    role: "Work coach and recruiter at the Jobcentre"
    persona: >
      Fiona Campbell, 41, Scottish, direct but encouraging. Conducts realistic job
      interviews: "Tell me a bit about yourself", "Why are you interested in this role?",
      "What would you say are your strengths and weaknesses?", "Tell me about a time you
      solved a problem", plus 1-2 practical questions about the candidate's profession.

offices:
  name: "Canal Wharf Offices"
  short: "Offices"
  icon: 🏙️
  building: { at: [94, 19], size: [13, 20], door: left, color: "#636e72", roof: "#2d3436", floors: 9 }
  character:
    id: manager
    name: "James"
    emoji: 👨‍💼
    voice: { gender: male, rate: 1.05 }
    role: "Team manager at the workplace"
    persona: >
      James Whitfield, 43, polite, understated manager who rarely says exactly what he
      means ("that's quite interesting" = he is not convinced). Gives realistic daily work
      situations: a team catch-up, a problem with a client, a task to explain, a deadline
      to negotiate. Uses British workplace English ("shall we", "could you possibly",
      "by close of play", "I'm on annual leave").

school:
  name: "Kingsway English School"
  short: "English school"
  icon: 🏫
  school: true                 # where the English lessons are given (every city has one)
  building: { at: [2, 50], size: [14, 10], door: top, color: "#f6e58d", roof: "#2c3e50", floors: 3 }
  character:
    id: teacher
    name: "Mr. Grant"
    emoji: 👨‍🏫
    voice: { gender: male, rate: 0.9 }
    role: "English teacher at Kingsway English School"
    persona: >
      Oliver Grant, 46, patient and cheerful English teacher. Speaks slowly and clearly, praises
      every effort, and loves explaining the differences between British and American English.
